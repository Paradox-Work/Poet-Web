name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist

      - run: cp .env.example .env

      - run: php artisan key:generate

      - run: touch database/database.sqlite

      - run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      # Temporary until package-lock.json includes the Playwright dependency.
      - run: npm install --no-audit --no-fund

      - run: npm run build

      - run: php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: database/database.sqlite

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Start isolated Laravel server
        run: |
          DB_CONNECTION=sqlite DB_DATABASE="${{ github.workspace }}/database/database.sqlite" APP_ENV=testing APP_DEBUG=false MAIL_MAILER=array QUEUE_CONNECTION=sync php artisan serve --host=127.0.0.1 --port=8000 > /tmp/poet-web-server.log 2>&1 &
          echo $! > /tmp/poet-web-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/poet-web-server.log
          exit 1

      - name: Browser regression tests
        run: npm run test:browser
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
